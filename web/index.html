<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault — Movie Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0d0d0f;
            --ink-2: #1c1c22;
            --ink-3: #2e2e38;
            --silver: #8a8a9a;
            --mist: #b8b8c8;
            --cream: #f5f3ee;
            --cream-2: #eeebe3;
            --gold: #c9a84c;
            --gold-light: #e8c96e;
            --gold-dim: rgba(201,168,76,0.15);
            --red: #c0392b;
            --green: #27ae60;
            --card-bg: #16161e;
            --border: rgba(255,255,255,0.07);
            --border-gold: rgba(201,168,76,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--ink);
            color: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.35;
        }

        /* ── HEADER ── */
        header {
            position: relative;
            padding: 60px 60px 50px;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        header::before {
            content: 'CINEVAULT';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Playfair Display', serif;
            font-size: 180px;
            font-weight: 900;
            color: rgba(255,255,255,0.02);
            letter-spacing: -8px;
            pointer-events: none;
            white-space: nowrap;
        }

        .header-inner {
            display: flex;
            align-items: flex-end;
            gap: 24px;
        }

        .logo-mark {
            width: 64px;
            height: 64px;
            background: var(--gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            box-shadow: 0 0 40px rgba(201,168,76,0.3);
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            color: var(--cream);
        }

        .header-text h1 span {
            color: var(--gold);
        }

        .header-text p {
            color: var(--silver);
            font-size: 14px;
            font-weight: 300;
            margin-top: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── NAV ── */
        nav {
            display: flex;
            gap: 2px;
            padding: 20px 60px;
            background: var(--ink-2);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        nav::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 10px 22px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--silver);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .nav-btn:hover {
            color: var(--cream);
            background: rgba(255,255,255,0.05);
            border-color: var(--border);
        }

        .nav-btn.active {
            color: var(--ink);
            background: var(--gold);
            border-color: var(--gold);
            font-weight: 600;
        }

        /* ── SECTIONS ── */
        .section { display: none; padding: 50px 60px; }
        .section.active { display: block; animation: fadeUp 0.35s ease; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 36px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--cream);
        }

        .section-header .pill {
            background: var(--gold-dim);
            color: var(--gold);
            border: 1px solid var(--border-gold);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* ── MOVIE GRID ── */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .movie-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .movie-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .movie-card:hover::before { opacity: 1; }

        .movie-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .movie-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--cream);
            line-height: 1.3;
            flex: 1;
            margin-right: 12px;
        }

        .year-badge {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--mist);
            font-size: 12px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .movie-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--silver);
        }

        .meta-row .icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        .edit-chip {
            background: rgba(201,168,76,0.1);
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-chip:hover {
            background: rgba(201,168,76,0.2);
        }

        .rating-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stars-bar {
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            flex: 1;
            overflow: hidden;
        }

        .stars-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .rating-num {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
        }

        .divider { height: 1px; background: var(--border); margin: 16px 0; }

        .movie-id {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-edit {
            background: rgba(39,174,96,0.15);
            border: 1px solid rgba(39,174,96,0.3);
            color: #4ade80;
            flex: 1;
        }

        .btn-edit:hover {
            background: rgba(39,174,96,0.25);
        }

        .btn-delete {
            background: rgba(192,57,43,0.15);
            border: 1px solid rgba(192,57,43,0.3);
            color: #f87171;
        }

        .btn-delete:hover {
            background: rgba(192,57,43,0.25);
        }

        /* ── FORM STYLES ── */
        .form-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--silver);
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--gold);
            background: rgba(201,168,76,0.05);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
        }

        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }

        .btn-primary {
            padding: 13px 28px;
            background: var(--gold);
            color: var(--ink);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(201,168,76,0.3);
        }

        .toast {
            padding: 14px 18px;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .toast.success {
            background: rgba(39,174,96,0.12);
            border: 1px solid rgba(39,174,96,0.3);
            color: #4ade80;
        }

        .toast.error {
            background: rgba(192,57,43,0.12);
            border: 1px solid rgba(192,57,43,0.3);
            color: #f87171;
        }

        /* ── TOP RATED TABLE ── */
        .top-table {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .top-table table { width: 100%; border-collapse: collapse; }

        .top-table th {
            padding: 16px 20px;
            background: rgba(201,168,76,0.08);
            color: var(--gold);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .top-table td {
            padding: 16px 20px;
            color: var(--cream);
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .top-table tr:last-child td { border-bottom: none; }

        .top-table tr:hover td { background: rgba(255,255,255,0.02); }

        .rank-cell {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            width: 60px;
        }

        .rank-1 { color: var(--gold); }
        .rank-2 { color: var(--silver); }
        .rank-3 { color: #cd7f32; }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(201,168,76,0.1);
            border: 1px solid var(--border-gold);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }

        /* ── ACTORS ── */
        .actors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .actor-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            transition: all 0.2s;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .actor-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-2px);
        }

        .actor-avatar {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--ink-3), var(--ink-2));
            border: 2px solid var(--border-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .actor-info h3 {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: var(--cream);
            margin-bottom: 4px;
        }

        .actor-info p {
            font-size: 12px;
            color: var(--silver);
        }

        /* ── MODAL ── */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--ink-2);
            border: 1px solid var(--border-gold);
            padding: 36px;
            border-radius: 20px;
            width: 480px;
            max-width: 92%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .modal-content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--cream);
            margin-bottom: 24px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-save {
            padding: 11px 22px;
            background: var(--gold);
            color: var(--ink);
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-save:hover { background: var(--gold-light); }

        .btn-cancel {
            padding: 11px 22px;
            background: transparent;
            color: var(--silver);
            border: 1px solid var(--border);
            border-radius: 9px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: rgba(255,255,255,0.05);
            color: var(--cream);
        }

        /* ── EMPTY ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--silver);
        }

        .empty-state .big-icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state p { font-size: 16px; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--ink); }
        ::-webkit-scrollbar-thumb { background: var(--ink-3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--silver); }

        @media (max-width: 768px) {
            header, nav, .section { padding-left: 24px; padding-right: 24px; }
            .movies-grid { grid-template-columns: 1fr; }
            header::before { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo-mark">🎬</div>
            <div class="header-text">
                <h1>Cine<span>Vault</span></h1>
                <p>Movie Database System</p>
            </div>
        </div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="showSection('movies', this)">📽 All Movies</button>
        <button class="nav-btn" onclick="showSection('add-movie', this)">＋ Add Movie</button>
        <button class="nav-btn" onclick="showSection('add-review', this)">✦ Add Review</button>
        <button class="nav-btn" onclick="showSection('top-rated', this)">🏆 Top Rated</button>
        <button class="nav-btn" onclick="showSection('actors', this)">🎭 Actors</button>
    </nav>

    <!-- Movies -->
    <div id="movies" class="section active">
        <div class="section-header">
            <h2>All Movies</h2>
            <span class="pill" id="movies-count">Loading…</span>
        </div>
        <div class="movies-grid" id="movies-list"></div>
    </div>

    <!-- Add Movie -->
    <div id="add-movie" class="section">
        <div class="section-header"><h2>Add New Movie</h2></div>
        <div class="form-box">
            <form id="movieForm">
                <div class="form-group">
                    <label>Movie Title</label>
                    <input type="text" id="title" placeholder="e.g. Inception" required>
                </div>
                <div class="form-group">
                    <label>Release Year</label>
                    <input type="number" id="year" placeholder="e.g. 2010" required>
                </div>
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" id="duration" placeholder="e.g. 148" required>
                </div>
                <div class="form-group">
                    <label>Language</label>
                    <input type="text" id="language" placeholder="e.g. English" required>
                </div>
                <button type="submit" class="btn-primary">Add Movie →</button>
            </form>
            <div id="add-message"></div>
        </div>
    </div>

    <!-- Add Review -->
    <div id="add-review" class="section">
        <div class="section-header"><h2>Write a Review</h2></div>
        <div class="form-box">
            <form id="reviewForm">
                <div class="form-group">
                    <label>Movie ID</label>
                    <input type="number" id="movie_id" placeholder="Enter ID from movies list" required>
                </div>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="reviewer" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label>Rating (0 – 10)</label>
                    <input type="number" step="0.1" id="rating" min="0" max="10" placeholder="e.g. 8.5" required>
                </div>
                <div class="form-group">
                    <label>Review</label>
                    <textarea id="review" rows="4" placeholder="Share your thoughts…"></textarea>
                </div>
                <button type="submit" class="btn-primary">Submit Review →</button>
            </form>
            <div id="review-message"></div>
        </div>
    </div>

    <!-- Top Rated -->
    <div id="top-rated" class="section">
        <div class="section-header"><h2>Top Rated</h2></div>
        <div id="top-rated-list"></div>
    </div>

    <!-- Actors -->
    <div id="actors" class="section">
        <div class="section-header"><h2>Actors</h2></div>
        <div class="actors-grid" id="actors-list"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function showSection(name, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (name === 'movies') loadMovies();
            if (name === 'top-rated') loadTopRated();
            if (name === 'actors') loadActors();
        }

        async function loadMovies() {
            const container = document.getElementById('movies-list');
            const countEl = document.getElementById('movies-count');
            container.innerHTML = '<div style="color:var(--silver);padding:40px;text-align:center;grid-column:1/-1">Loading…</div>';
            try {
                const res = await fetch(API_BASE + '/movies');
                const movies = await res.json();
                countEl.textContent = movies.length + ' Films';
                if (!movies.length) {
                    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">🎞</div><p>No movies yet — add one!</p></div>`;
                    return;
                }
                container.innerHTML = movies.map(m => {
                    const rating = m.average_rating || 0;
                    const pct = (rating / 10 * 100).toFixed(0);
                    return `
                    <div class="movie-card">
                        <div class="movie-card-top">
                            <h3>${m.title}</h3>
                            <span class="year-badge">${m.release_year}</span>
                        </div>
                        <div class="movie-meta">
                            <div class="meta-row">
                                <span class="icon">🌐</span>
                                <span id="lang-${m.movie_id}" class="edit-chip" onclick="showEditModal(${m.movie_id},'language','${m.language||'N/A'}')">${m.language||'N/A'} ✏️</span>
                            </div>
                            <div class="meta-row">
                                <span class="icon">⏱</span>
                                <span id="dur-${m.movie_id}" class="edit-chip" onclick="showEditModal(${m.movie_id},'duration',${m.duration_minutes||0})">${m.duration_minutes||'N/A'} min ✏️</span>
                            </div>
                            <div class="meta-row">
                                <span class="icon">🎬</span>
                                <span>${m.director_name||'N/A'}</span>
                            </div>
                            <div class="meta-row">
                                <span class="icon">🎭</span>
                                <span>${m.genre_name||'N/A'}</span>
                            </div>
                        </div>
                        <div class="rating-display">
                            <span class="rating-num">${rating}</span>
                            <div class="stars-bar"><div class="stars-fill" style="width:${pct}%"></div></div>
                            <span style="font-size:12px;color:var(--silver)">${m.total_reviews||0} reviews</span>
                        </div>
                        <div class="divider"></div>
                        <div class="movie-id">ID #${m.movie_id}</div>
                        <div class="card-actions">
                            <button class="btn btn-edit" onclick="showFullEditModal(${m.movie_id})">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteMovie(${m.movie_id})">🗑</button>
                        </div>
                    </div>`;
                }).join('');
            } catch {
                container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">⚠️</div><p>Cannot connect to server.</p></div>`;
            }
        }

        function showEditModal(movieId, field, currentValue) {
            const labels = { title:'Movie Title', year:'Release Year', duration:'Duration (minutes)', language:'Language' };
            const types  = { title:'text', year:'number', duration:'number', language:'text' };
            document.body.insertAdjacentHTML('beforeend', `
                <div id="editModal" class="modal">
                    <div class="modal-content">
                        <h3>Edit ${labels[field]}</h3>
                        <div class="form-group">
                            <label>${labels[field]}</label>
                            <input type="${types[field]}" id="editValue" value="${currentValue}">
                        </div>
                        <div class="modal-buttons">
                            <button class="btn-save" onclick="saveField(${movieId},'${field}')">Save Changes</button>
                            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                        </div>
                    </div>
                </div>`);
        }

        async function saveField(movieId, field) {
            const newValue = document.getElementById('editValue').value;
            const res = await fetch(API_BASE + '/movies/get?id=' + movieId);
            const movie = await res.json();
            let updateData = { movie_id: movieId, title: movie.title, year: movie.release_year, duration: movie.duration_minutes, language: movie.language };
            if (field === 'title') updateData.title = newValue;
            if (field === 'year') updateData.year = parseInt(newValue);
            if (field === 'duration') updateData.duration = parseInt(newValue);
            if (field === 'language') updateData.language = newValue;
            const r = await fetch(API_BASE + '/movies/update', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams(updateData) });
            const result = await r.json();
            if (result.success) { closeModal(); loadMovies(); loadTopRated(); }
            else alert('❌ Update failed');
        }

        async function showFullEditModal(movieId) {
            const res = await fetch(API_BASE + '/movies/get?id=' + movieId);
            const movie = await res.json();
            document.body.insertAdjacentHTML('beforeend', `
                <div id="editModal" class="modal">
                    <div class="modal-content">
                        <h3>Edit — ${movie.title}</h3>
                        <form id="fullEditForm">
                            <div class="form-group"><label>Title</label><input type="text" id="edit_title" value="${movie.title}" required></div>
                            <div class="form-group"><label>Release Year</label><input type="number" id="edit_year" value="${movie.release_year}" required></div>
                            <div class="form-group"><label>Duration (min)</label><input type="number" id="edit_duration" value="${movie.duration_minutes}" required></div>
                            <div class="form-group"><label>Language</label><input type="text" id="edit_language" value="${movie.language}" required></div>
                            <div class="modal-buttons">
                                <button type="submit" class="btn-save">Save Changes</button>
                                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>`);
            document.getElementById('fullEditForm').addEventListener('submit', async e => {
                e.preventDefault();
                const r = await fetch(API_BASE + '/movies/update', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ movie_id:movieId, title:document.getElementById('edit_title').value, year:document.getElementById('edit_year').value, duration:document.getElementById('edit_duration').value, language:document.getElementById('edit_language').value }) });
                const result = await r.json();
                if (result.success) { closeModal(); loadMovies(); loadTopRated(); }
                else alert('❌ Update failed');
            });
        }

        function closeModal() {
            const m = document.getElementById('editModal');
            if (m) m.remove();
        }

        async function deleteMovie(movieId) {
            if (!confirm('Delete this movie and all its reviews?')) return;
            const r = await fetch(API_BASE + '/movies/delete', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ movie_id: movieId }) });
            const result = await r.json();
            if (result.success) { loadMovies(); loadTopRated(); }
            else alert('❌ Delete failed');
        }

        document.getElementById('movieForm')?.addEventListener('submit', async e => {
            e.preventDefault();
            const messageDiv = document.getElementById('add-message');
            try {
                const r = await fetch(API_BASE + '/movies/add', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ title:document.getElementById('title').value, year:document.getElementById('year').value, duration:document.getElementById('duration').value, language:document.getElementById('language').value }) });
                const result = await r.json();
                if (result.success) {
                    messageDiv.innerHTML = '<div class="toast success">✓ Movie added successfully!</div>';
                    document.getElementById('movieForm').reset();
                    loadMovies();
                    setTimeout(() => messageDiv.innerHTML = '', 3500);
                } else {
                    messageDiv.innerHTML = '<div class="toast error">✕ Error adding movie</div>';
                }
            } catch {
                messageDiv.innerHTML = '<div class="toast error">✕ Server error</div>';
            }
        });

        document.getElementById('reviewForm')?.addEventListener('submit', async e => {
            e.preventDefault();
            const messageDiv = document.getElementById('review-message');
            try {
                const r = await fetch(API_BASE + '/reviews/add', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ movie_id:document.getElementById('movie_id').value, reviewer:document.getElementById('reviewer').value, rating:document.getElementById('rating').value, review:document.getElementById('review').value }) });
                const result = await r.json();
                if (result.success) {
                    messageDiv.innerHTML = '<div class="toast success">✓ Review submitted! Rating updated.</div>';
                    document.getElementById('reviewForm').reset();
                    loadMovies(); loadTopRated();
                    setTimeout(() => messageDiv.innerHTML = '', 3500);
                } else {
                    messageDiv.innerHTML = '<div class="toast error">✕ Error submitting review</div>';
                }
            } catch {
                messageDiv.innerHTML = '<div class="toast error">✕ Server error</div>';
            }
        });

        async function loadTopRated() {
            const container = document.getElementById('top-rated-list');
            try {
                const res = await fetch(API_BASE + '/top-rated');
                const movies = await res.json();
                if (!movies.length) {
                    container.innerHTML = `<div class="empty-state"><div class="big-icon">⭐</div><p>No ratings yet.</p></div>`;
                    return;
                }
                const medals = ['🥇','🥈','🥉'];
                container.innerHTML = `
                    <div class="top-table">
                        <table>
                            <thead><tr><th>Rank</th><th>Title</th><th>Rating</th><th>Reviews</th></tr></thead>
                            <tbody>
                                ${movies.map((m,i) => `
                                    <tr>
                                        <td class="rank-cell rank-${i+1}">${medals[i] || '#'+(i+1)}</td>
                                        <td style="font-weight:600">${m.title}</td>
                                        <td><span class="rating-badge">⭐ ${m.average_rating}</span></td>
                                        <td style="color:var(--silver)">${m.total_reviews}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } catch {
                container.innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div><p>Error loading top rated.</p></div>`;
            }
        }

        async function loadActors() {
            const container = document.getElementById('actors-list');
            try {
                const res = await fetch(API_BASE + '/actors');
                const actors = await res.json();
                if (!actors.length) {
                    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">🎭</div><p>No actors found.</p></div>`;
                    return;
                }
                container.innerHTML = actors.map(a => `
                    <div class="actor-card">
                        <div class="actor-avatar">🎭</div>
                        <div class="actor-info">
                            <h3>${a.actor_name}</h3>
                            <p>🌍 ${a.nationality||'N/A'}</p>
                            <p>📅 ${a.date_of_birth||'N/A'}</p>
                        </div>
                    </div>`).join('');
            } catch {
                container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">⚠️</div><p>Error loading actors.</p></div>`;
            }
        }

        loadMovies();
        loadTopRated();
        loadActors();
    </script>
</body>
</html>
